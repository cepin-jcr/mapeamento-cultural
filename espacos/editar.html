  <script>
    let agenteId = null;
    let agenteSlug = null;
    
    function slugify(text) {
      if(!text) return '';
      return text.toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
    }

    function handleBack(e) {
      if (e) e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    async function checkAuthAndLoad() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawSlug = urlParams.get('slug');
      const paramId = urlParams.get('id');
      agenteSlug = rawSlug ? decodeURIComponent(rawSlug) : (paramId ? paramId : null);

      const storedSession = localStorage.getItem('custom_session');
      if (!storedSession) {
        window.location.href = `../perfil/index.html?msg=${encodeURIComponent('Para editar ou criar, faça login primeiro.')}`;
        return;
      }
      const sessionUser = JSON.parse(storedSession);

      if (!agenteSlug && !paramId) {
        // Modo Criação
        if (!sessionUser.is_admin) {
          alert('Apenas administradores podem criar espaços.');
          window.location.href = '/';
          return;
        }
        document.getElementById('form-title').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>Criar Espaço`;
        document.getElementById('btn-delete').classList.add('hidden');
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('edit-form-container').classList.remove('hidden');
        return;
      }

      let tries = 0;
      while (!window.supabaseClient && tries < 10) {
        await new Promise(r => setTimeout(r, 100));
        tries++;
      }

      if (!window.supabaseClient) {
        alert('Falha na conexão com o banco de dados.');
        window.location.href = '/';
        return;
      }

      const { data: espacos, error } = await supabaseClient.from('espacos').select('*');
      if (error || !espacos) {
        alert('Erro ao carregar dados do espaço.');
        return;
      }

      const agente = espacos.find(a => 
        (paramId && String(a.id) === String(paramId)) ||
        (agenteSlug && slugify(a.nome) === slugify(agenteSlug)) ||
        (agenteSlug && a.nome.toLowerCase() === agenteSlug.toLowerCase()) ||
        (agenteSlug && String(a.id) === String(agenteSlug))
      );
      if (!agente) {
        alert('Espaço não encontrado no banco de dados principal.');
        window.location.href = '/';
        return;
      }

      const isAdmin = sessionUser.is_admin === true || sessionUser.is_admin === 1 || sessionUser.is_admin === 'true';
      const isOwner = isAdmin || (agente.user_id && String(agente.user_id) === String(sessionUser.id));
      if (!isOwner) {
        alert('Você não tem permissão para editar este espaço.');
        window.location.href = '/';
        return;
      }

      agenteId = agente.id;

      document.getElementById('edit-nome').value = agente.nome || '';
      if(document.getElementById('edit-tipo')) document.getElementById('edit-tipo').value = agente.tipo || 'Público';
      if(document.getElementById('edit-categoria')) document.getElementById('edit-categoria').value = agente.categoria || '';
      if(document.getElementById('edit-descricao')) document.getElementById('edit-descricao').value = agente.descricao || '';
      document.getElementById('edit-endereco').value = agente.endereco || '';
      window.originalEndereco = agente.endereco || '';
      
      if (agente.foto) {
        const preview = document.getElementById('preview-foto');
        preview.src = agente.foto;
        preview.classList.remove('hidden');
        window.currentFotoData = agente.foto;
      }

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('edit-form-container').classList.remove('hidden');
    }

    async function compressImage(file, maxWidth = 1200) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/webp', 0.8));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('edit-foto').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        const base64 = await compressImage(file);
        window.currentFotoData = base64;
        const preview = document.getElementById('preview-foto');
        preview.src = base64;
        preview.classList.remove('hidden');
      }
    });



    document.getElementById('agent-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.innerText = 'Salvando... (Aguarde)';
      btn.disabled = true;

      const videoLines = document.getElementById('edit-videos').value.split('\n').map(v => v.trim()).filter(v => v.length > 0);

      const enderecoDigitado = document.getElementById('edit-endereco').value.trim();
      let newLat = undefined;
      let newLng = undefined;

      if (enderecoDigitado && enderecoDigitado !== window.originalEndereco) {
        btn.innerText = 'Buscando Coordenadas...';
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(enderecoDigitado)}`);
          const data = await res.json();
          if (data && data.length > 0) {
            newLat = parseFloat(data[0].lat);
            newLng = parseFloat(data[0].lon);
          } else {
            console.warn('Geocoding não encontrou resultados para:', enderecoDigitado);
          }
        } catch (e) {
          console.error('Erro na geocodificação:', e);
        }
      }

      btn.innerText = 'Salvando... (Aguarde)';

      const updates = {
        nome: document.getElementById('edit-nome').value,
        tipo: document.getElementById('edit-tipo') ? document.getElementById('edit-tipo').value : '',
        categoria: document.getElementById('edit-categoria') ? document.getElementById('edit-categoria').value : '',
        descricao: document.getElementById('edit-descricao') ? document.getElementById('edit-descricao').value : '',
        endereco: enderecoDigitado,
        foto: window.currentFotoData || null
      };

      if (newLat !== undefined && newLng !== undefined) {
        updates.lat = newLat;
        updates.lng = newLng;
      }

      let error;
      if (agenteId) {
        // Atualizar
        const res = await supabaseClient.from('espacos').update(updates).eq('id', agenteId);
        error = res.error;
      } else {
        // Criar
        const res = await supabaseClient.from('espacos').insert(updates);
        error = res.error;
      }
      
      if (error) {
        alert('Erro ao salvar espaço. Erro: ' + error.message);
        btn.innerText = agenteId ? 'Salvar Alterações' : 'Criar Espaço';
        btn.disabled = false;
      } else {
        alert(agenteId ? 'Espaço atualizado com sucesso!' : 'Espaço criado com sucesso!');
        window.location.href = `../perfil/index.html`;
      }
    });

    window.deleteAgent = async () => {
      if (!agenteId) return;
      if (confirm('Tem certeza que deseja excluir este espaço definitivamente? Esta ação não pode ser desfeita.')) {
        const { error } = await supabaseClient.from('espacos').delete().eq('id', agenteId);
        if (!error) {
          alert('Espaço excluído com sucesso.');
          window.location.href = '/';
        } else {
          alert('Erro ao excluir espaço: ' + error.message);
        }
      }
    };

    window.onload = checkAuthAndLoad;
  </script>

    <script>
      (function() {
        var path = window.location.pathname;
        var links = document.querySelectorAll('#bottom-nav-links a');
        links.forEach(function(link) {
          var dataPath = link.getAttribute('data-path');
          if ((dataPath === 'index.html' && (path.endsWith('/') || path.endsWith('index.html') && !path.includes('/mapa/') && !path.includes('/calendario/') && !path.includes('/eventos/') && !path.includes('/espacos/') && !path.includes('/agentes/') && !path.includes('/mulheres/') && !path.includes('/perfil/') && !path.includes('/cepin/'))) || 
              (dataPath !== 'index.html' && path.includes('/' + dataPath + '/'))) {
            link.classList.remove('text-muted-foreground', 'hover:text-primary');
            link.classList.add('text-primary', 'bg-primary/10', 'rounded-lg');
          }
        });
      })();
    </script>
  </nav>
