        <div class="space-y-2">
          <label class="text-sm font-semibold text-foreground uppercase tracking-wider">Descrição</label>
          <textarea id="edit-descricao" rows="6" required class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm resize-y"></textarea>
        </div>

          <label class="text-sm font-semibold text-foreground uppercase tracking-wider">Local do Evento</label>
          <input type="text" id="edit-local" required placeholder="Ex: MAB - Museu de Antropologia" class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm">
        </div>

          <label class="text-sm font-semibold text-foreground uppercase tracking-wider">Foto de Capa</label>
          <input type="file" id="edit-foto" accept="image/*" class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm">

            Excluir Evento

  <script>
    let agenteId = null;
    let agenteSlug = null;
    
    function slugify(text) {
      if(!text) return '';
      return text.toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 -]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
    }

    function handleBack(e) {
      if (e) e.preventDefault();
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '../calendario/index.html';
      }
    }

    async function checkAuthAndLoad() {
      const urlParams = new URLSearchParams(window.location.search);
      const rawSlug = urlParams.get('slug');
      const paramId = urlParams.get('id');
      agenteSlug = rawSlug ? decodeURIComponent(rawSlug) : (paramId ? paramId : null);

      const storedSession = localStorage.getItem('custom_session');
      if (!storedSession) {
        window.location.href = `../perfil/index.html?msg=${encodeURIComponent('Para editar ou criar, faça login primeiro.')}`;
        return;
      }
      const sessionUser = JSON.parse(storedSession);

      if (!agenteSlug && !paramId) {
        // Modo Criação
        if (!sessionUser.is_admin) {
          alert('Apenas administradores podem criar eventos.');
          window.location.href = '../perfil/index.html';
          return;
        }
        document.getElementById('form-title').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>Criar Evento`;
        document.getElementById('btn-delete').classList.add('hidden');
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('edit-form-container').classList.remove('hidden');
        return;
      }

      let tries = 0;
      while (!window.supabaseClient && tries < 10) {
        await new Promise(r => setTimeout(r, 100));
        tries++;
      }

      if (!window.supabaseClient) {
        alert('Falha na conexão com o banco de dados.');
        window.location.href = './index.html';
        return;
      }

      const { data: eventos, error } = await supabaseClient.from('eventos').select('*');
      if (error || !eventos) {
        alert('Erro ao carregar dados do evento.');
        return;
      }

      const agente = eventos.find(a => 
        (paramId && String(a.id) === String(paramId)) ||
        (agenteSlug && slugify(a.nome) === slugify(agenteSlug)) ||
        (agenteSlug && a.nome.toLowerCase() === agenteSlug.toLowerCase()) ||
        (agenteSlug && String(a.id) === String(agenteSlug))
      );
      if (!agente) {
        alert('Evento não encontrado no banco de dados principal.');
        window.location.href = '../calendario/index.html';
        return;
      }

      agenteId = agente.id;

      document.getElementById('edit-nome').value = agente.nome || '';
      if(document.getElementById('edit-data_hora')) document.getElementById('edit-data_hora').value = agente.data_hora || '';
      if(document.getElementById('edit-categoria')) document.getElementById('edit-categoria').value = agente.categoria || '';
      if(document.getElementById('edit-descricao')) document.getElementById('edit-descricao').value = agente.descricao || '';
      if(document.getElementById('edit-local')) document.getElementById('edit-local').value = agente.local || '';
      
      if (agente.foto) {
        const preview = document.getElementById('preview-foto');
        preview.src = agente.foto;
        preview.classList.remove('hidden');
        window.currentFotoData = agente.foto;
      }

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('edit-form-container').classList.remove('hidden');
    }

    async function compressImage(file, maxWidth = 1200) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/webp', 0.8));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('edit-foto').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        const base64 = await compressImage(file);
        window.currentFotoData = base64;
        const preview = document.getElementById('preview-foto');
        preview.src = base64;
        preview.classList.remove('hidden');
      }
    });



    document.getElementById('agent-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-save');
      btn.innerText = 'Salvando... (Aguarde)';
      btn.disabled = true;

      const videoLines = document.getElementById('edit-videos').value.split('\n').map(v => v.trim()).filter(v => v.length > 0);

      const enderecoDigitado = document.getElementById('edit-endereco').value.trim();
      let newLat = undefined;
      let newLng = undefined;

      if (enderecoDigitado && enderecoDigitado !== window.originalEndereco) {
        btn.innerText = 'Buscando Coordenadas...';
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(enderecoDigitado)}`);
          const data = await res.json();
          if (data && data.length > 0) {
            newLat = parseFloat(data[0].lat);
            newLng = parseFloat(data[0].lon);
          } else {
            console.warn('Geocoding não encontrou resultados para:', enderecoDigitado);
          }
        } catch (e) {
          console.error('Erro na geocodificação:', e);
        }
      }

      btn.innerText = 'Salvando... (Aguarde)';

      const updates = {
        nome: document.getElementById('edit-nome').value,
        data_hora: document.getElementById('edit-data_hora') ? document.getElementById('edit-data_hora').value : '',
        categoria: document.getElementById('edit-categoria') ? document.getElementById('edit-categoria').value : '',
        descricao: document.getElementById('edit-descricao') ? document.getElementById('edit-descricao').value : '',
        local: document.getElementById('edit-local') ? document.getElementById('edit-local').value : '',
        foto: window.currentFotoData || null
      };

      if (newLat !== undefined && newLng !== undefined) {
        updates.lat = newLat;
        updates.lng = newLng;
      }

      let error;
      if (agenteId) {
        // Atualizar
        const res = await supabaseClient.from('eventos').update(updates).eq('id', agenteId);
        error = res.error;
      } else {
        // Criar
        const res = await supabaseClient.from('eventos').insert(updates);
        error = res.error;
      }
      
      if (error) {
        alert('Erro ao salvar evento. Erro: ' + error.message);
        btn.innerText = agenteId ? 'Salvar Alterações' : 'Criar Evento';
        btn.disabled = false;
      } else {
        alert(agenteId ? 'Evento atualizado com sucesso!' : 'Evento criado com sucesso!');
        window.location.href = `../perfil/index.html`;
      }
    });

    window.deleteAgent = async () => {
      if (!agenteId) return;
      if (confirm('Tem certeza que deseja excluir este evento definitivamente? Esta ação não pode ser desfeita.')) {
        const { error } = await supabaseClient.from('eventos').delete().eq('id', agenteId);
        if (!error) {
          alert('Evento excluído com sucesso.');
          window.location.href = '../perfil/index.html';
        } else {
          alert('Erro ao excluir evento: ' + error.message);
        }
      }
    };

    window.onload = checkAuthAndLoad;
  </script>
