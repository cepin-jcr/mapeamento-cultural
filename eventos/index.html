    window.addEventListener('load', () => {

  <script>
    let todosEventos = [];
    let categoriaAtual = 'Todos';
    let termoBusca = '';

    async function carregarEventos() {
      if (window.supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('eventos').select('*').order('id', {ascending: false});
          if (!error && data && data.length > 0) {
            todosEventos = data;
          }
        } catch (e) {
          console.warn("Erro ao buscar do supabase:", e);
        }
      }

      // Se vazio, fallback básico
      if (todosEventos.length === 0) {
        todosEventos = [
          {
            id: 1,
            nome: "Festival de Música da Mantiqueira",
            categoria: "Música",
            data_hora: "20/09/2026 às 19:00",
            local: "Parque dos Espanhóis, Jacareí",
            foto: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=800",
            descricao: "Um grande encontro musical celebrando a diversidade sonora do Vale do Paraíba e da Serra da Mantiqueira com artistas autorais e atrações convidadas."
          },
          {
            id: 2,
            nome: "Exposição Olhares do Vale",
            categoria: "Artes Visuais",
            data_hora: "15/10/2026 às 14:00",
            local: "MAB - Museu de Antropologia",
            foto: "https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&q=80&w=800",
            descricao: "Mostra fotográfica e artística retratando as tradições, o patrimônio histórico e as manifestações culturais populares do Vale do Paraíba."
          },
          {
            id: 3,
            nome: "Teatro na Praça: Histórias do Rio",
            categoria: "Teatro",
            data_hora: "05/11/2026 às 16:30",
            local: "Sala Mário Lago",
            foto: "https://images.unsplash.com/photo-1507676184212-d03ab07a01bf?auto=format&fit=crop&q=80&w=800",
            descricao: "Espetáculo cênico gratuito e ao ar livre baseado nas lendas e contos ribeirinhos que marcaram as gerações da nossa região."
          }
        ];
      }

      aplicarFiltros();
      verificarParametrosUrl();
    }

    function renderEventos(eventos) {
      const grid = document.getElementById('eventosGrid');
      grid.innerHTML = '';
      if (eventos.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center py-16 text-muted-foreground text-sm font-medium">Nenhum evento encontrado para os filtros selecionados.</div>';
        return;
      }

      eventos.forEach(ev => {
        const fotoUrl = ev.foto || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=800';
        const descLimpa = (ev.descricao || 'Nenhuma descrição informada.').replace(/(?:\r?\n)?Cadastrado por:.*$/is, '').trim();
        const card = `
          <div id="evento-card-${ev.id}" data-id="${ev.id}" data-nome="${(ev.nome || '').toLowerCase()}" class="evento-card group bg-card border border-border rounded-xl overflow-hidden shadow-sm hover:shadow-soft transition-all duration-300 flex flex-col h-full">
            <div class="h-48 overflow-hidden bg-muted relative">
              <img src="${fotoUrl}" alt="${ev.nome || 'Evento'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
              <div class="absolute top-3 left-3 bg-background/90 backdrop-blur text-foreground text-xs font-bold uppercase px-2.5 py-1 rounded-md shadow-sm">
                ${ev.categoria || 'Evento'}
              </div>
            </div>
            <div class="p-6 flex-grow flex flex-col">
              <h3 class="text-xl font-bold text-foreground mb-2 group-hover:text-primary transition-colors leading-snug">${ev.nome || 'Sem Nome'}</h3>
              <p class="text-sm text-muted-foreground mb-4 line-clamp-2">${descLimpa}</p>
              <div class="flex flex-col gap-2 mt-auto">
                <div class="flex items-center gap-2 text-xs text-muted-foreground font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  ${ev.data_hora || ev.data || 'Data a confirmar'}
                </div>
                <div class="flex items-center gap-2 text-xs text-muted-foreground font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${ev.local || 'Local não informado'}
                </div>
                <div class="flex items-center gap-2 text-xs text-muted-foreground font-medium mt-1">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
                  Organizado por: ${ev.organizador || 'Não informado'}
                </div>
                <button onclick='abrirDetalhesEvento(${JSON.stringify(ev).replace(/'/g, "&apos;")})' class="mt-4 w-full py-2.5 bg-primary/10 hover:bg-primary text-primary hover:text-primary-foreground font-semibold text-sm rounded-lg transition-all text-center block shadow-sm">
                  Ver Detalhes
                </button>
              </div>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    function toggleDropdownFiltros(e) {
      if (e) e.stopPropagation();
      const menu = document.getElementById('filterDropdownMenu');
      const chevron = document.getElementById('filterDropdownChevron');
      const isOpen = !menu.classList.contains('hidden');
      if (isOpen) {
        fecharDropdownFiltros();
      } else {
        menu.classList.remove('hidden');
        if (chevron) chevron.classList.add('rotate-180');
      }
    }

    function fecharDropdownFiltros() {
      const menu = document.getElementById('filterDropdownMenu');
      const chevron = document.getElementById('filterDropdownChevron');
      if (menu) menu.classList.add('hidden');
      if (chevron) chevron.classList.remove('rotate-180');
    }

    document.addEventListener('click', (e) => {
      const container = document.getElementById('filterDropdownContainer');
      if (container && !container.contains(e.target)) {
        fecharDropdownFiltros();
      }
    });

    function selecionarFiltro(cat) {
      categoriaAtual = cat;
      fecharDropdownFiltros();

      const btnTodos = document.getElementById('btnFilterTodos');
      const btnDropdown = document.getElementById('btnFilterDropdown');
      const label = document.getElementById('filterDropdownLabel');

      document.querySelectorAll('.filter-opt-btn').forEach(btn => {
        const isMatch = btn.getAttribute('data-value') === cat;
        const checkIcon = btn.querySelector('.check-icon');
        if (isMatch) {
          btn.classList.add('bg-primary/10', 'text-primary', 'font-semibold');
          if (checkIcon) checkIcon.classList.remove('hidden');
        } else {
          btn.classList.remove('bg-primary/10', 'text-primary', 'font-semibold');
          if (checkIcon) checkIcon.classList.add('hidden');
        }
      });

      if (cat === 'Todos') {
        if (btnTodos) {
          btnTodos.className = "cat-btn active bg-primary text-primary-foreground px-4 py-2.5 rounded-md font-medium text-sm transition-all shadow-sm flex items-center gap-1.5 shrink-0";
        }
        if (btnDropdown) {
          btnDropdown.className = "bg-background border border-input text-foreground hover:border-primary hover:text-primary px-4 py-2.5 rounded-md font-medium text-sm transition-all flex items-center gap-2 cursor-pointer shadow-sm";
        }
        if (label) label.innerText = 'Filtros';
      } else {
        if (btnTodos) {
          btnTodos.className = "cat-btn bg-background border border-input text-foreground hover:border-primary hover:text-primary px-4 py-2.5 rounded-md font-medium text-sm transition-all flex items-center gap-1.5 shrink-0";
        }
        if (btnDropdown) {
          btnDropdown.className = "bg-primary/10 border border-primary text-primary font-semibold px-4 py-2.5 rounded-md text-sm transition-all flex items-center gap-2 cursor-pointer shadow-sm";
        }
        if (label) label.innerText = `Filtro: ${cat}`;
      }

      aplicarFiltros();
    }

    function filtrarCategoria(cat, btn) {
      selecionarFiltro(cat);
    }

    function normalizeStr(str) {
      if (!str) return '';
      return String(str).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function aplicarFiltros() {
      let filtrados = todosEventos;
      if (categoriaAtual !== 'Todos') {
        const target = normalizeStr(categoriaAtual);
        filtrados = filtrados.filter(ev => normalizeStr(ev.categoria).includes(target));
      }
      if (termoBusca) {
        const termo = normalizeStr(termoBusca);
        filtrados = filtrados.filter(ev => 
          normalizeStr(ev.nome).includes(termo) ||
          normalizeStr(ev.descricao).includes(termo) ||
          normalizeStr(ev.local).includes(termo)
        );
      }
      renderEventos(filtrados);
    }

    document.getElementById('searchInput')?.addEventListener('input', (e) => {
      termoBusca = e.target.value.trim();
      aplicarFiltros();
    });

    function abrirDetalhesEvento(ev) {
      document.getElementById('modalEventoNome').innerText = ev.nome || 'Evento Cultural';
      document.getElementById('modalEventoCategoria').innerText = ev.categoria || 'Evento';
      document.getElementById('modalEventoDataHora').innerText = ev.data_hora || ev.data || 'Data a confirmar';
      document.getElementById('modalEventoLocal').innerText = ev.local || 'Local não informado';
      const descModal = (ev.descricao || 'Nenhuma descrição adicional informada para este evento.').replace(/(?:\r?\n)?Cadastrado por:.*$/is, '').trim();
      document.getElementById('modalEventoDescricao').innerText = descModal;
      document.getElementById('modalEventoFoto').src = ev.foto || 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&q=80&w=800';
      
      const modal = document.getElementById('eventoModal');
      const content = document.getElementById('eventoModalContent');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-95');
      content.classList.add('scale-100');
    }

    function fecharModalEvento() {
      const modal = document.getElementById('eventoModal');
      const content = document.getElementById('eventoModalContent');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
    }

    // Fechar ao clicar fora
    document.getElementById('eventoModal')?.addEventListener('click', (e) => {
      if (e.target.id === 'eventoModal') fecharModalEvento();
    });

    function verificarParametrosUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      const paramId = urlParams.get('id');
      const paramNome = urlParams.get('nome') ? decodeURIComponent(urlParams.get('nome')).trim().toLowerCase() : null;

      if (!paramId && !paramNome) return;

      const eventoEncontrado = todosEventos.find(ev => 
        (paramId && String(ev.id) === String(paramId)) ||
        (paramNome && ev.nome && ev.nome.toLowerCase() === paramNome) ||
        (paramNome && ev.nome && ev.nome.toLowerCase().includes(paramNome))
      );

      if (eventoEncontrado) {
        setTimeout(() => {
          const cardEl = document.getElementById(`evento-card-${eventoEncontrado.id}`) || 
                         document.querySelector(`[data-nome="${(eventoEncontrado.nome || '').toLowerCase()}"]`);
          if (cardEl) {
            cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            cardEl.classList.add('ring-4', 'ring-primary', 'shadow-carnival');
          }
          abrirDetalhesEvento(eventoEncontrado);
        }, 300);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      carregarEventos();
    });

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('shadow-md', 'bg-background/95');
        navbar.classList.remove('bg-background/80');
      } else {
        navbar.classList.add('bg-background/80');
        navbar.classList.remove('shadow-md', 'bg-background/95');
      }
    });
  </script>

  


  <!-- Bottom Navigation Mobile -->
  <div id="bottom-nav-placeholder"></div>

</body>
</html>
