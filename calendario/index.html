<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário <span class="text-primary">Cultural</span> • Mapeamento Cultural</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Poppins', 'sans-serif'],
          },
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
              glow: "hsl(var(--primary-glow))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
            mulheres: "hsl(var(--mulheres-pink))"
          },
          boxShadow: {
            'carnival': 'var(--shadow-carnival)',
            'soft': 'var(--shadow-soft)',
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="../css/global.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase-integration.js"></script>
  <script src="../js/cadastro-modal.js?v=5" defer></script>

  <style>
    .hide-scroll-indicator::-webkit-scrollbar {
      display: none;
    }
    .hide-scroll-indicator {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

</head>
<body class="min-h-screen bg-background text-foreground transition-all duration-300 pb-24 md:pb-0">

  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <header class="pt-32 pb-16 px-6 bg-muted/30 border-b border-border text-center">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-4xl md:text-5xl font-display font-extrabold text-foreground mb-4 tracking-tight">Calendário <span class="text-primary">Cultural</span></h1>
      <p class="text-lg text-muted-foreground">
        Acompanhe a programação cultural da nossa região e não perca nenhum evento.
      </p>
    </div>
  </header>

  <!-- Calendar Container -->
  <section class="max-w-4xl mx-auto px-6 py-12">
    <div class="bg-card rounded-xl border border-border shadow-sm p-6 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 text-primary mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
      </div>
      <h3 class="text-xl font-display font-bold text-foreground mb-2" id="calendarTitle">Programação Cultural</h3>
      <p class="text-muted-foreground mb-8">Confira os próximos eventos confirmados cadastrados na plataforma.</p>

      <div class="space-y-4 text-left" id="eventsCalendarList">
        <div class="text-center py-12 text-muted-foreground">
          <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-primary mb-3"></div>
          <p class="text-sm">Carregando programação do banco de dados...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Shared JS Library & Components -->
  <script src="../js/db.js"></script>
  <script src="../js/components.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (typeof renderFooter === 'function') {
        renderFooter();
      }
    });

    function parseDateBR(dateStr) {
      if (!dateStr) return null;
      const str = dateStr.toLowerCase().trim();
      const months = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
      
      let match = str.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
      if (match) {
        let d = parseInt(match[1]);
        let m = parseInt(match[2]) - 1;
        let y = match[3] ? parseInt(match[3]) : new Date().getFullYear();
        if (y < 100) y += 2000;
        return new Date(y, m, d);
      }
      
      match = str.match(/(\d{1,2})\s+(?:de\s+)?([a-zç]+)/);
      if (match) {
        let d = parseInt(match[1]);
        let mStr = match[2];
        let m = months.findIndex(x => mStr.startsWith(x));
        if (m !== -1) {
          return new Date(new Date().getFullYear(), m, d);
        }
      }
      return null;
    }

    async function carregarCalendario() {
      const container = document.getElementById('eventsCalendarList');
      try {
        let eventos = [];
        if (window.supabaseClient) {
          const { data, error } = await supabaseClient.from('eventos').select('*');
          if (!error && data && data.length > 0) {
            eventos = data;
          }
        }

        const hoje = new Date();
        hoje.setHours(0,0,0,0);

        eventos.forEach(ev => {
          const dateStr = ev.data || ev.data_hora || '';
          ev.parsedDate = parseDateBR(dateStr);
        });

        eventos = eventos.filter(ev => {
          if (!ev.parsedDate) return true; 
          return ev.parsedDate >= hoje;
        });

        eventos.sort((a, b) => {
          if (a.parsedDate && b.parsedDate) {
             return a.parsedDate - b.parsedDate;
          }
          if (a.parsedDate) return -1;
          if (b.parsedDate) return 1;
          return b.id - a.id;
        });

        if (eventos.length === 0) {
          container.innerHTML = `
            <div class="text-center py-12 text-muted-foreground bg-muted/20 rounded-lg border border-dashed border-border p-8">
              <p class="font-medium text-foreground mb-1">Nenhum evento agendado no momento.</p>
              <p class="text-sm">Novos eventos cadastrados por agentes culturais aparecerão aqui automaticamente.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = '';
        eventos.forEach((ev, idx) => {
          const nomeEvento = ev.nome || ev.titulo || 'Evento Cultural';
          const dataTexto = ev.data || ev.data_hora || 'Em breve';
          const localTexto = ev.local || 'Local a confirmar';
          const descTexto = ev.descricao || 'Sem descrição detalhada.';
          
          let dateBadgePrimary = dataTexto;
          let dateBadgeSecondary = 'Evento';
          const parts = dataTexto.split(' ');
          if (parts.length >= 2) {
            dateBadgePrimary = parts.slice(0, 2).join(' ');
            dateBadgeSecondary = ev.horario || 'Confira';
          }

          container.innerHTML += `
            <div class="flex flex-col md:flex-row gap-4 p-5 rounded-xl border border-border bg-card hover:border-primary hover:shadow-soft transition-all duration-300">
              <div class="w-full md:w-28 text-center md:border-r border-border md:pr-4 flex flex-col justify-center py-2 bg-muted/40 md:bg-transparent rounded-lg md:rounded-none">
                <span class="text-sm font-bold text-primary uppercase">${dateBadgePrimary}</span>
                <span class="text-sm font-semibold text-foreground mt-0.5">${dateBadgeSecondary}</span>
              </div>
              <div class="flex-1">
                <div class="inline-block text-[11px] font-bold text-primary uppercase tracking-wider bg-primary/10 px-2 py-0.5 rounded mb-1.5">
                  ${ev.categoria || 'Cultura'}
                </div>
                <h4 class="text-lg font-bold text-foreground mb-1">${nomeEvento}</h4>
                <p class="text-sm text-muted-foreground mb-3 line-clamp-2">${descTexto}</p>
                <div class="flex items-center gap-2 text-xs text-muted-foreground font-medium">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${localTexto}
                </div>
              </div>
              <div class="flex items-center md:pl-4 mt-2 md:mt-0">
                <a href="../eventos/?id=${encodeURIComponent(ev.id || '')}&nome=${encodeURIComponent(nomeEvento)}" class="w-full md:w-auto text-center px-4 py-2.5 bg-primary text-primary-foreground text-sm font-semibold rounded-lg hover:bg-primary-glow transition-all shadow-sm whitespace-nowrap">Ver Detalhes</a>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error('Erro ao carregar calendário:', err);
        container.innerHTML = '<div class="text-center py-8 text-destructive">Erro ao carregar dados do calendário.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      carregarCalendario();
    });

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('shadow-md', 'bg-background/95');
        navbar.classList.remove('bg-background/80');
      } else {
        navbar.classList.add('bg-background/80');
        navbar.classList.remove('shadow-md', 'bg-background/95');
      }
    });
  </script>

  


  <!-- Bottom Navigation Mobile -->
  <div id="bottom-nav-placeholder"></div>

</body>
</html>
