      <form id="contactForm" class="space-y-6" onsubmit="handleSendMessage(event)">
        <div class="grid md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="text-sm font-semibold text-foreground uppercase tracking-wider">Nome Completo</label>
            <input type="text" id="msgNome" required class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm" placeholder="João da Silva">
          </div>
          <div class="space-y-2">
            <label class="text-sm font-semibold text-foreground uppercase tracking-wider">E-mail</label>
            <input type="email" id="msgEmail" required class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm" placeholder="joao@email.com">
          </div>
        </div>
        
        <div class="space-y-2">
          <label class="text-sm font-semibold text-foreground uppercase tracking-wider">Assunto</label>
          <input type="text" id="msgAssunto" required class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm" placeholder="Dúvida sobre cadastro">
        </div>
        
        <div class="space-y-2">
          <label class="text-sm font-semibold text-foreground uppercase tracking-wider">Mensagem</label>
          <textarea id="msgTexto" rows="5" required class="w-full px-4 py-3 bg-background border border-input rounded-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors text-sm resize-none" placeholder="Escreva sua mensagem aqui..."></textarea>
        </div>
        
        <button type="submit" id="btnSubmit" class="w-full md:w-auto px-8 py-3 bg-primary text-primary-foreground font-semibold rounded-md shadow-sm hover:bg-primary-glow transition-all flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span id="btnSubmitText">Enviar Mensagem</span>
        </button>
      </form>
    </div>
  </section>

  <!-- Shared JS Library & Components -->

  <script>
    window.addEventListener('load', () => {
      if (typeof renderFooter === 'function') {
        renderFooter();
      }
    });

    async function handleSendMessage(e) {
      e.preventDefault();
      const alertBox = document.getElementById('feedbackAlert');
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnSubmitText');
      
      const nome = document.getElementById('msgNome').value.trim();
      const email = document.getElementById('msgEmail').value.trim();
      const assunto = document.getElementById('msgAssunto').value.trim();
      const mensagem = document.getElementById('msgTexto').value.trim();

      if (!nome || !email || !mensagem) {
        alertBox.className = 'mb-6 p-4 rounded-lg text-sm font-medium bg-destructive/10 text-destructive border border-destructive/20 block';
        alertBox.innerText = 'Por favor, preencha todos os campos obrigatórios.';
        return;
      }

      btn.disabled = true;
      btnText.innerText = 'Enviando...';
      alertBox.className = 'hidden';

      try {
        if (window.supabaseClient) {
          const { error } = await supabaseClient.from('mensagens').insert([
            { nome, email, assunto, mensagem }
          ]);
          if (error) throw error;
        }

        alertBox.className = 'mb-6 p-4 rounded-lg text-sm font-medium bg-success/10 text-success border border-success/20 block';
        alertBox.innerText = 'Sua mensagem foi enviada com sucesso! A equipe do Mapeamento Cultural entrará em contato em breve.';
        document.getElementById('contactForm').reset();
      } catch (err) {
        console.error('Erro ao enviar mensagem:', err);
        alertBox.className = 'mb-6 p-4 rounded-lg text-sm font-medium bg-destructive/10 text-destructive border border-destructive/20 block';
        alertBox.innerText = 'Ocorreu um erro ao enviar sua mensagem. Por favor, tente novamente.';
      } finally {
        btn.disabled = false;
        btnText.innerText = 'Enviar Mensagem';
      }
    }

    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        navbar.classList.add('shadow-md', 'bg-background/95');
        navbar.classList.remove('bg-background/80');
      } else {
        navbar.classList.add('bg-background/80');
        navbar.classList.remove('shadow-md', 'bg-background/95');
      }
    });
  </script>
